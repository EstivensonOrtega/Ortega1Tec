<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Ortega1Tec</title>
  <desc id="desc">Aplicación Blazor WebAssembly, biblioteca de componentes y GitHub Pages.</desc>
  <rect width="1100" height="620" fill="#0f172a"/>
  <text x="60" y="70" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Ortega1Tec</text>
  <text x="60" y="105" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="18">Arquitectura estática para GitHub Pages</text>
  <rect x="70" y="165" width="270" height="245" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="215" fill="#bfdbfe" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Ortega1Tec.Web</text>
  <text x="100" y="255" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="17">Blazor WebAssembly</text>
  <text x="100" y="288" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="17">Pages y navegación</text>
  <text x="100" y="321" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="17">wwwroot publicable</text>
  <text x="100" y="354" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="17">Punto de entrada</text>
  <rect x="415" y="165" width="270" height="245" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="445" y="215" fill="#bbf7d0" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Components</text>
  <text x="445" y="255" fill="#dcfce7" font-family="Segoe UI, sans-serif" font-size="17">Biblioteca Razor</text>
  <text x="445" y="288" fill="#dcfce7" font-family="Segoe UI, sans-serif" font-size="17">Componentes reutilizables</text>
  <text x="445" y="321" fill="#dcfce7" font-family="Segoe UI, sans-serif" font-size="17">CSS y JavaScript</text>
  <text x="445" y="354" fill="#dcfce7" font-family="Segoe UI, sans-serif" font-size="17">_content/Components</text>
  <path d="M340 287 H415" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="760" y="165" width="270" height="245" rx="14" fill="#431407" stroke="#fb923c" stroke-width="2"/>
  <text x="790" y="215" fill="#fed7aa" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">GitHub Pages</text>
  <text x="790" y="255" fill="#ffedd5" font-family="Segoe UI, sans-serif" font-size="17">Archivos estáticos</text>
  <text x="790" y="288" fill="#ffedd5" font-family="Segoe UI, sans-serif" font-size="17">index.html + 404.html</text>
  <text x="790" y="321" fill="#ffedd5" font-family="Segoe UI, sans-serif" font-size="17">HTTPS público</text>
  <text x="790" y="354" fill="#ffedd5" font-family="Segoe UI, sans-serif" font-size="17">/Ortega1Tec/</text>
  <path d="M685 287 H760" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="70" y="485" width="960" height="72" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="100" y="530" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="18">GitHub Actions: restore → publish → preparar wwwroot → deploy-pages</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker></defs>
</svg>
